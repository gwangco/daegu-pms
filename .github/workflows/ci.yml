# 빌드·테스트 자동화 (Pull Request 마다 실행 → 테스트가 깨진 코드는 병합 전에 발견)
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'feature/**' ]

# 최소 권한 원칙: 소스 읽기만 허용 (토큰 유출 시 피해 최소화)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven 빌드 및 테스트 (JDK 17, MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 외부 Action 은 태그가 아닌 커밋 SHA 로 고정 (태그가 바뀌어 악성 코드가 실행되는 공급망 공격 방지)
      # 세 Action 모두 Node.js 24 실행 버전 (GitHub 가 Node.js 20 실행을 폐기 예정으로 안내하고 Node.js 24 로 강제 실행 중)
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 17 설치
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 테스트 전용 MySQL. 비밀번호는 실행할 때마다 새로 만들고 로그에서는 가린다 (저장소에 DB 비밀번호를 두지 않음)
      # 이미지는 태그가 아닌 digest 로 고정 (같은 태그에 다른 이미지가 올라와도 영향 없음)
      - name: MySQL 8.4 LTS 테스트 DB 준비
        run: |
          ROOT_PW="$(openssl rand -hex 16)"; OWNER_PW="$(openssl rand -hex 16)"; APP_PW="$(openssl rand -hex 16)"
          echo "::add-mask::$ROOT_PW"; echo "::add-mask::$OWNER_PW"; echo "::add-mask::$APP_PW"
          docker run -d --name mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD="$ROOT_PW" -e TZ=Asia/Seoul \
            mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
          # 컨테이너는 초기화용 임시 서버를 먼저 띄우므로 TCP 로 접속되는 본 서버가 뜰 때까지 기다린다
          for i in $(seq 1 60); do
            if docker exec -e MYSQL_PWD="$ROOT_PW" mysql mysqladmin ping -h 127.0.0.1 -uroot --silent 2>/dev/null; then break; fi
            sleep 2
          done
          docker exec -i -e MYSQL_PWD="$ROOT_PW" mysql mysql -h 127.0.0.1 -uroot <<SQL
          CREATE DATABASE dpms_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
          CREATE USER 'dpms_owner'@'%' IDENTIFIED BY '$OWNER_PW';
          GRANT ALL PRIVILEGES ON dpms_test.* TO 'dpms_owner'@'%';
          CREATE USER 'dpms_app'@'%' IDENTIFIED BY '$APP_PW';
          GRANT SELECT, INSERT, UPDATE, DELETE ON dpms_test.* TO 'dpms_app'@'%';
          GRANT SELECT ON performance_schema.data_lock_waits TO 'dpms_app'@'%';
          SQL
          {
            echo "DPMS_DB_USERNAME=dpms_app"
            echo "DPMS_DB_PASSWORD=$APP_PW"
            echo "DPMS_DB_MIGRATION_USERNAME=dpms_owner"
            echo "DPMS_DB_MIGRATION_PASSWORD=$OWNER_PW"
          } >> "$GITHUB_ENV"

      - name: 빌드 및 테스트
        run: ./mvnw -B -ntp verify

      - name: 실패 시 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  # Docker Compose 로 앱 + MySQL 을 실제로 띄워 응답을 확인한다 (README 의 Docker 실행 방법이 계속 동작하는지)
  compose:
    name: Docker Compose 실행 확인 (앱 + MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .env 는 실행할 때마다 무작위 비밀번호로 만들고 로그에서는 가린다 (저장소에는 .env.example 만 있다)
      - name: 실행 설정(.env) 준비
        run: |
          ROOT_PW="$(openssl rand -hex 16)"; OWNER_PW="$(openssl rand -hex 16)"; APP_PW="$(openssl rand -hex 16)"
          echo "::add-mask::$ROOT_PW"; echo "::add-mask::$OWNER_PW"; echo "::add-mask::$APP_PW"
          {
            echo "MYSQL_ROOT_PASSWORD=$ROOT_PW"
            echo "DPMS_DB_MIGRATION_PASSWORD=$OWNER_PW"
            echo "DPMS_DB_PASSWORD=$APP_PW"
          } > .env

      - name: 이미지 빌드와 기동
        run: docker compose up -d --build

      # 앱은 DB 준비 확인이 통과한 뒤 뜨고, 뜰 때 Flyway 가 스키마와 데모 데이터를 넣는다
      # (응답을 파일로 받은 뒤 확인한다: 파이프로 grep -q 에 넘기면 grep 이 먼저 끝나 curl 이 실패로 끝날 수 있다)
      - name: 화면 응답과 데모 데이터 확인
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8080/login; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w "로그인 화면 %{http_code}\n" http://localhost:8080/login
          curl -fsS -o /dev/null -w "메인 화면 %{http_code}\n" http://localhost:8080/
          curl -fsS -o announcements.html http://localhost:8080/announcements
          grep -q "대구 미래 모빌리티" announcements.html && echo "공고 목록에 데모 데이터가 보임"
          docker compose logs --no-color app > app.log
          grep -q "공고 마감" app.log && echo "기동 직후 공고 마감 배치 실행"

      - name: 실패 시 로그 출력
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: 정리
        if: always()
        run: docker compose down -v
