server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # 에러 화면에 스택트레이스/예외 메시지를 노출하지 않음 (시큐어코딩: 오류 메시지 정보노출 방지)
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: daegu-pms
  profiles:
    active: local

  # 초경량 H2 Database (개발 및 로컬 테스트용)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:daegupms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # H2 웹 콘솔은 기본 비활성화. local 프로필(application-local.yml)에서만 켠다.
  h2:
    console:
      enabled: false

  # 정적 리소스 및 Thymeleaf 뷰 템플릿 설정
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # 사업계획서 및 전자세금계산서/영수증 증빙 파일 업로드 용량 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

  # SQL 초기화 스크립트 실행 (schema.sql, data.sql)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      # 미지정 시 OS 기본 문자셋(한글 Windows = MS949)으로 읽어 한글 seed 데이터가 깨진다
      encoding: UTF-8

# MyBatis 설정은 eGovFrame 방식대로 Java Config(EgovConfigMapper) + egovframework/sqlmap/sql-mapper-config.xml 에서 관리

# D-PMS 애플리케이션 전용 설정
app:
  file:
    # 첨부파일 물리 저장 경로 (웹 루트 밖, 실행 위치 기준 상대경로)
    upload-dir: ./uploads
    # 업로드 허용 확장자 화이트리스트 (시큐어코딩: 위험한 형식 파일 업로드 차단)
    allowed-extensions: pdf,hwp,hwpx,doc,docx,xls,xlsx,jpg,jpeg,png,zip
  paging:
    # 전자정부 표준 페이징: 한 페이지 게시물 수 / 페이지 블록 크기
    page-unit: 10
    page-size: 10
  batch:
    # 공고 마감 배치 실행 주기 (초 분 시 일 월 요일) - 매일 자정
    announcement-close-cron: "0 0 0 * * *"

# 로깅 레벨
logging:
  level:
    root: INFO
    kr.go.daegu.pms: DEBUG
    org.springframework.security: INFO
