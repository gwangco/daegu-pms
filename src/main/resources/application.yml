server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      # 30분 동안 요청이 없으면 세션 만료 (공공기관 시스템의 일반적인 자동 로그아웃 기준)
      timeout: 30m
      # 세션 ID 를 URL(;jsessionid=...)에 붙이지 않는다. 주소 공유·로그·Referer 로 세션이 새는 것을 막는다
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # HTTPS 운영에서는 SERVER_SERVLET_SESSION_COOKIE_SECURE=true 로 켠다 (로컬 http 데모라 기본값 false)
  # 에러 화면에 스택트레이스/예외 메시지를 노출하지 않음 (시큐어코딩: 오류 메시지 정보노출 방지)
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: daegu-pms
  profiles:
    active: local
  # 로컬 DB 비밀번호 파일 (scripts/setup-local-mysql.ps1 이 생성, Git 제외). 없으면 건너뛴다.
  # 같은 이름의 환경변수가 있으면 환경변수가 우선한다 (CI·운영은 환경변수로 넣는다)
  config:
    import: "optional:file:./config/dpms-secret.yml"

  # MySQL 8.x. 비밀번호 기본값은 두지 않는다 (없으면 기동 실패 → 잘못된 계정으로 조용히 뜨는 일이 없다)
  datasource:
    url: ${DPMS_DB_URL:jdbc:mysql://127.0.0.1:3306/dpms?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul}
    # 서버 실행 계정: 조회·등록·수정·삭제 권한만 있다 (테이블 생성·삭제 불가)
    username: ${DPMS_DB_USERNAME:dpms_app}
    password: ${DPMS_DB_PASSWORD}
    hikari:
      pool-name: dpms-pool
      maximum-pool-size: 10
      # 커넥션을 얻지 못하면 무한정 기다리지 않고 5초 뒤 오류로 끝낸다
      connection-timeout: 5000

  # Flyway: db/migration 의 V1, V2 ... 를 순서대로 한 번씩 적용한다
  flyway:
    # 테이블 변경은 별도 계정으로만 (서버 실행 계정에는 DDL 권한이 없다)
    user: ${DPMS_DB_MIGRATION_USERNAME:dpms_owner}
    password: ${DPMS_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    # 운영 DB 를 통째로 지우는 clean 명령은 막아 둔다 (테스트 프로필에서만 허용)
    clean-disabled: true
    # 이미 적용한 파일이 바뀌었으면 기동을 멈춘다 (적용된 마이그레이션은 고치지 않고 새 버전을 추가한다)
    validate-on-migrate: true

  # 정적 리소스 및 Thymeleaf 뷰 템플릿 설정
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # 사업계획서 및 전자세금계산서/영수증 증빙 파일 업로드 용량 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

# MyBatis 설정은 eGovFrame 방식대로 Java Config(EgovConfigMapper) + egovframework/sqlmap/sql-mapper-config.xml 에서 관리

# 전자정부 암호화 서비스 (egovframe-boot-starter-crypto 자동 구성) - 연락처·이메일 컬럼 암호화에 사용
# 키는 저장소에 두지 않는다. 운영은 환경변수(또는 키 관리 시스템)로 넣고, 값이 없으면 기동하지 않는다.
org:
  egovframe:
    crypto:
      algorithm: SHA-256                         # 키 검증용 해시 (EgovPasswordEncoder)
      algorithm-key: ${DPMS_CRYPTO_KEY:}         # ARIA 마스터 키 (영문·숫자 32자)
      algorithm-key-hash: ${DPMS_CRYPTO_KEY_HASH:}
      crypto-block-size: 1024

# 전자정부 공통컴포넌트가 읽는 전역 설정 (공통컴포넌트 원본은 globals.properties 에 둔다)
# 값은 D-PMS 설정을 그대로 가리켜 같은 경로를 두 곳에서 따로 관리하지 않게 한다
Globals:
  fileStorePath: ${app.file.upload-dir}

# D-PMS 애플리케이션 전용 설정
app:
  file:
    # 첨부파일 물리 저장 경로 (웹 루트 밖, 실행 위치 기준 상대경로)
    upload-dir: ./uploads
    # 업로드 허용 확장자 화이트리스트 (시큐어코딩: 위험한 형식 파일 업로드 차단)
    allowed-extensions: pdf,hwp,hwpx,doc,docx,xls,xlsx,jpg,jpeg,png,zip
  paging:
    # 전자정부 표준 페이징: 한 페이지 게시물 수 / 페이지 블록 크기
    page-unit: 10
    page-size: 10
  batch:
    # 공고 마감 배치 실행 주기 (초 분 시 일 월 요일) - 매일 자정
    announcement-close-cron: "0 0 0 * * *"
  login:
    # 비밀번호를 연속으로 틀리면 계정을 잠근다 (반복된 인증 시도 제한)
    max-failures: 5
    # 잠금 유지 시간. 지나면 다시 로그인할 수 있고, 관리자가 먼저 풀 수도 있다
    lock-duration: 30m
  crypto:
    # 평문으로 남아 있는 연락처·이메일을 기동 시 암호화할지 (운영은 별도 전환 작업으로 처리하고 꺼 둔다)
    encrypt-plain-on-startup: false

# 로깅 레벨
logging:
  level:
    root: INFO
    # Mapper DEBUG는 SQL 바인딩 값(사업계획·평가 의견·정산 적요)을 그대로 출력한다.
    # 로컬 데모에서도 실제 업무 내용을 입력할 수 있으므로 기본 INFO를 유지한다.
    kr.go.daegu.pms: INFO
    org.springframework.security: INFO
