server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      # 30분 동안 요청이 없으면 세션 만료 (공공기관 시스템의 일반적인 자동 로그아웃 기준)
      timeout: 30m
      # 세션 ID 를 URL(;jsessionid=...)에 붙이지 않는다. 주소 공유·로그·Referer 로 세션이 새는 것을 막는다
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # HTTPS 운영에서는 SERVER_SERVLET_SESSION_COOKIE_SECURE=true 로 켠다 (로컬 http 데모라 기본값 false)
  # 에러 화면에 스택트레이스/예외 메시지를 노출하지 않음 (시큐어코딩: 오류 메시지 정보노출 방지)
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: daegu-pms
  profiles:
    active: local

  # 초경량 H2 Database (개발 및 로컬 테스트용)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:daegupms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # H2 웹 콘솔은 기본 비활성화. local 프로필(application-local.yml)에서만 켠다.
  h2:
    console:
      enabled: false

  # 정적 리소스 및 Thymeleaf 뷰 템플릿 설정
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # 사업계획서 및 전자세금계산서/영수증 증빙 파일 업로드 용량 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

  # SQL 초기화 스크립트 실행 (schema.sql, data.sql)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      # 미지정 시 OS 기본 문자셋(한글 Windows = MS949)으로 읽어 한글 seed 데이터가 깨진다
      encoding: UTF-8

# MyBatis 설정은 eGovFrame 방식대로 Java Config(EgovConfigMapper) + egovframework/sqlmap/sql-mapper-config.xml 에서 관리

# 전자정부 암호화 서비스 (egovframe-boot-starter-crypto 자동 구성) - 연락처·이메일 컬럼 암호화에 사용
# 키는 저장소에 두지 않는다. 운영은 환경변수(또는 키 관리 시스템)로 넣고, 값이 없으면 기동하지 않는다.
org:
  egovframe:
    crypto:
      algorithm: SHA-256                         # 키 검증용 해시 (EgovPasswordEncoder)
      algorithm-key: ${DPMS_CRYPTO_KEY:}         # ARIA 마스터 키 (영문·숫자 32자)
      algorithm-key-hash: ${DPMS_CRYPTO_KEY_HASH:}
      crypto-block-size: 1024

# D-PMS 애플리케이션 전용 설정
app:
  file:
    # 첨부파일 물리 저장 경로 (웹 루트 밖, 실행 위치 기준 상대경로)
    upload-dir: ./uploads
    # 업로드 허용 확장자 화이트리스트 (시큐어코딩: 위험한 형식 파일 업로드 차단)
    allowed-extensions: pdf,hwp,hwpx,doc,docx,xls,xlsx,jpg,jpeg,png,zip
  paging:
    # 전자정부 표준 페이징: 한 페이지 게시물 수 / 페이지 블록 크기
    page-unit: 10
    page-size: 10
  batch:
    # 공고 마감 배치 실행 주기 (초 분 시 일 월 요일) - 매일 자정
    announcement-close-cron: "0 0 0 * * *"
  login:
    # 비밀번호를 연속으로 틀리면 계정을 잠근다 (반복된 인증 시도 제한)
    max-failures: 5
    # 잠금 유지 시간. 지나면 다시 로그인할 수 있고, 관리자가 먼저 풀 수도 있다
    lock-duration: 30m
  crypto:
    # 평문으로 남아 있는 연락처·이메일을 기동 시 암호화할지 (운영은 별도 전환 작업으로 처리하고 꺼 둔다)
    encrypt-plain-on-startup: false

# 로깅 레벨
logging:
  level:
    root: INFO
    # Mapper DEBUG는 SQL 바인딩 값(사업계획·평가 의견·정산 적요)을 그대로 출력한다.
    # 로컬 데모에서도 실제 업무 내용을 입력할 수 있으므로 기본 INFO를 유지한다.
    kr.go.daegu.pms: INFO
    org.springframework.security: INFO
