<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>일시적인 오류가 발생했습니다 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f1f4f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }</style>
</head>
<body>
<!-- 오류 화면은 다른 fragment 에 의존하지 않는 단독 페이지로 구성 (오류 화면 렌더링 중 2차 오류 방지) -->
<!-- 시큐어코딩: 예외 클래스명/스택트레이스/SQL 등 내부 정보는 절대 화면에 출력하지 않는다 -->
<div class="card border-0 shadow-sm p-5 text-center" style="max-width: 520px; width: 100%;">
    <div class="fs-1 text-danger mb-2"><i class="bi bi-tools"></i></div>
    <h4 class="fw-bold text-dark mb-3">일시적인 오류가 발생했습니다</h4>
    <p class="text-secondary mb-4" th:text="${errorMessage != null} ? ${errorMessage} : '서비스 처리 중 오류가 발생했습니다. 잠시 후 다시 시도하세요.'">서비스 처리 중 오류가 발생했습니다. 잠시 후 다시 시도하세요.</p>
    <div class="d-flex justify-content-center gap-2">
        <button type="button" class="btn btn-outline-secondary" onclick="history.back()">이전 화면</button>
        <a th:href="@{/}" class="btn btn-primary">메인으로</a>
    </div>
</div>
</body>
</html>
