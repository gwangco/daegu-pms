<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/simple}">
<head>
    <title>일시적인 오류가 발생했습니다</title>
</head>
<body>
<th:block layout:fragment="content">
    <div th:replace="~{fragments/error :: errorContent(${status != null} ? ${status} : '500', '일시적인 오류가 발생했습니다',
            ${errorMessage != null} ? ${errorMessage} : '서비스 처리 중 오류가 발생했습니다. 잠시 후 다시 시도하세요.')}"></div>
</th:block>
</body>
</html>
