<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/simple}">
<head>
    <title>접근 권한이 없습니다</title>
</head>
<body>
<th:block layout:fragment="content">
    <div th:replace="~{fragments/error :: errorContent('403', '접근 권한이 없습니다',
            ${errorMessage != null} ? ${errorMessage} : '요청하신 화면 또는 데이터에 대한 접근 권한이 없습니다.')}"></div>
</th:block>
</body>
</html>
