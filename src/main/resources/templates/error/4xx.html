<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/simple}">
<head>
    <title>잘못된 요청입니다</title>
</head>
<body>
<th:block layout:fragment="content">
    <div th:replace="~{fragments/error :: errorContent(${status != null} ? ${status} : '400', '잘못된 요청입니다',
            ${errorMessage != null} ? ${errorMessage} : '요청 형식이 올바르지 않습니다. 입력값을 확인하세요.')}"></div>
</th:block>
</body>
</html>
