<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/simple}">
<head>
    <title>요청을 처리할 수 없습니다</title>
</head>
<body>
<th:block layout:fragment="content">
    <div th:replace="~{fragments/error :: errorContent('400', '요청을 처리할 수 없습니다',
            ${errorMessage != null} ? ${errorMessage} : '입력 내용을 확인한 뒤 다시 시도하세요.')}"></div>
</th:block>
</body>
</html>
