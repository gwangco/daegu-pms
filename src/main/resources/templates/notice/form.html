<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:with="isNew=${#strings.isEmpty(notice.noticeId)}">
<head>
    <meta charset="UTF-8">
    <title th:text="${isNew} ? '공지 등록 | D-PMS' : '공지 수정 | D-PMS'">공지 등록 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- 생성기의 noticeRegister.html 처럼 등록/수정을 한 화면에서 처리 (noticeId 유무로 구분) -->
<div class="container py-4" style="max-width: 860px;">
    <div class="mb-3">
        <a th:href="@{/notices}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> 공지사항 목록으로</a>
    </div>

    <div class="card border-0 shadow-sm p-4 bg-white">
        <h4 class="fw-bold text-dark mb-4" th:text="${isNew} ? '공지사항 등록' : '공지사항 수정'">공지사항 등록</h4>

        <!-- th:action 을 쓰면 Spring Security CSRF 토큰이 hidden 으로 자동 포함된다 -->
        <form th:action="${isNew} ? @{/notices/new} : @{/notices/{id}/edit(id=${notice.noticeId})}"
              th:object="${notice}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">제목 <span class="text-danger">*</span></label>
                <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid" maxlength="200">
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{importantYn}" value="Y" class="form-check-input" id="importantYn">
                <label class="form-check-label" for="importantYn">중요 공지 (목록 상단 고정)</label>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">내용 <span class="text-danger">*</span></label>
                <textarea th:field="*{content}" class="form-control" th:errorclass="is-invalid" rows="12" maxlength="4000"></textarea>
                <div class="invalid-feedback" th:errors="*{content}"></div>
            </div>
            <div class="d-flex justify-content-between pt-3 border-top">
                <a th:href="${isNew} ? @{/notices} : @{/notices/{id}(id=${notice.noticeId})}" class="btn btn-outline-secondary">취소</a>
                <button type="submit" class="btn btn-primary px-4 fw-semibold" th:text="${isNew} ? '등록' : '저장'">등록</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
