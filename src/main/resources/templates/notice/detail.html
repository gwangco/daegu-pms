<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${notice.title} + ' | 공지사항 | D-PMS'">공지사항 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: flash}"></div>

<div class="container py-4" style="max-width: 900px;">
    <div class="mb-3">
        <a th:href="@{/notices}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> 공지사항 목록으로</a>
    </div>

    <div class="card border-0 shadow-sm p-4 bg-white">
        <div class="mb-2">
            <span th:if="${notice.importantYn == 'Y'}" class="badge bg-danger me-1">중요</span>
            <span class="text-muted small" th:text="${notice.noticeId}">NTC_0000000001</span>
        </div>
        <h4 class="fw-bold text-dark mb-2" th:text="${notice.title}">공지 제목</h4>
        <div class="text-muted small border-bottom pb-3 mb-3">
            작성자 <strong th:text="${notice.writerName}">김담당</strong> ·
            등록일 <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-21 09:00</span> ·
            조회수 <span th:text="${notice.viewCount}">1</span>
            <span th:if="${notice.updatedAt != null}"> · 수정일 <span th:text="${#temporals.format(notice.updatedAt, 'yyyy-MM-dd HH:mm')}"></span></span>
        </div>

        <!-- th:text 는 HTML 특수문자를 이스케이프하므로 본문에 <script> 가 있어도 실행되지 않는다. 줄바꿈은 CSS 로 표시 -->
        <div class="mb-4" style="line-height: 1.8; white-space: pre-line; min-height: 160px;" th:text="${notice.content}">본문</div>

        <div class="d-flex justify-content-between pt-3 border-top">
            <a th:href="@{/notices}" class="btn btn-outline-secondary">목록</a>
            <div sec:authorize="hasAnyRole('MANAGER', 'ADMIN')" class="d-flex gap-2">
                <a th:href="@{/notices/{id}/edit(id=${notice.noticeId})}" class="btn btn-outline-primary">수정</a>
                <!-- 삭제는 반드시 POST + CSRF 토큰 (GET 링크로 삭제하면 이미지 태그 등으로 위조 요청이 가능) -->
                <form th:action="@{/notices/{id}/delete(id=${notice.noticeId})}" method="post" class="m-0"
                      onsubmit="return confirm('공지사항을 삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-outline-danger">삭제</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
