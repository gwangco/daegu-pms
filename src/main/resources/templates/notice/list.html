<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>공지사항 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: flash}"></div>

<!-- eGovFrame CRUD 코드 생성기의 noticeList.html 구조(검색 → 목록 → 페이징 → 등록)를 프로젝트 레이아웃으로 옮김 -->
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1">공지사항</h3>
            <p class="text-muted small mb-0">지원사업 운영 관련 안내 사항을 확인하세요.</p>
        </div>
        <a sec:authorize="hasAnyRole('MANAGER', 'ADMIN')" th:href="@{/notices/new}" class="btn btn-primary btn-sm">
            <i class="bi bi-pencil me-1"></i> 공지 등록
        </a>
    </div>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3">
            <form id="searchForm" th:action="@{/notices}" th:object="${searchVO}" method="get" class="row g-2 align-items-center">
                <input type="hidden" th:field="*{pageIndex}">
                <div class="col-md-2">
                    <select th:field="*{searchCondition}" class="form-select form-select-sm">
                        <option value="">제목+내용</option>
                        <option value="title">제목</option>
                        <option value="content">내용</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <input type="text" th:field="*{searchKeyword}" class="form-control form-control-sm" placeholder="검색어 입력..." maxlength="50">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary btn-sm w-100"><i class="bi bi-search me-1"></i> 검색</button>
                </div>
            </form>
        </div>
    </div>

    <div class="small text-muted mb-2">총 <strong class="text-dark" th:text="${paginationInfo.totalRecordCount}">0</strong>건</div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="text-center" style="width: 8%">번호</th>
                        <th>제목</th>
                        <th class="text-center" style="width: 14%">작성자</th>
                        <th class="text-center" style="width: 14%">등록일</th>
                        <th class="text-center" style="width: 9%">조회수</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="n, stat : ${resultList}" th:classappend="${n.importantYn == 'Y'} ? 'table-warning'">
                        <!-- 게시판 역순 번호: 전체건수 - (현재페이지-1)*페이지당건수 - 행번호 + 1 (eGov 샘플과 같은 계산) -->
                        <td class="text-center small">
                            <span th:if="${n.importantYn == 'Y'}" class="badge bg-danger">중요</span>
                            <span th:unless="${n.importantYn == 'Y'}"
                                  th:text="${paginationInfo.totalRecordCount - (searchVO.pageIndex - 1) * searchVO.recordCountPerPage - stat.index}">1</span>
                        </td>
                        <td>
                            <a th:href="@{/notices/{id}(id=${n.noticeId})}" class="text-decoration-none text-dark fw-semibold" th:text="${n.title}">제목</a>
                        </td>
                        <td class="text-center small" th:text="${n.writerName}">김담당</td>
                        <td class="text-center small" th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd')}">2026-10-21</td>
                        <td class="text-center small" th:text="${n.viewCount}">0</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(resultList)}">
                        <td colspan="5" class="text-center py-4 text-muted">등록된 공지사항이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: pagination(${paginationInfo})}"></th:block>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
