<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>공지사항</title>
</head>
<body>
<!--/* 전자정부 공통컴포넌트 게시판(cop.bbs)의 게시물 목록. 검색 → 목록 → 페이징 → 등록 순서는 eGov 샘플 화면과 같다 */-->
<th:block layout:fragment="content">
    <div class="page-head">
        <div class="container">
            <nav aria-label="현재 위치">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">홈</a></li>
                    <li class="breadcrumb-item active" aria-current="page">공지사항</li>
                </ol>
            </nav>
            <div class="page-head-row">
                <div>
                    <h1>공지사항</h1>
                    <p class="lead-sub">지원사업 운영과 시스템 이용 안내를 확인하세요.</p>
                </div>
                <div class="page-actions" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">
                    <a th:href="@{/notices/new}" class="btn btn-primary btn-lg">
                        <i class="bi bi-pencil me-1" aria-hidden="true"></i>공지 등록
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <form id="searchForm" th:action="@{/notices}" th:object="${searchVO}" method="get" class="search-box" role="search"
              th:with="filtered=${!#strings.isEmpty(searchVO.searchCnd) or !#strings.isEmpty(searchVO.searchWrd)}">
            <input type="hidden" th:field="*{pageIndex}">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-3">
                    <label for="searchCnd" class="form-label">검색 대상</label>
                    <!--/* 공통컴포넌트 게시판 검색 조건 값: 0 제목, 1 내용, 2 작성자 (빈 값은 제목+내용) */-->
                    <select th:field="*{searchCnd}" class="form-select">
                        <option value="">제목+내용</option>
                        <option value="0">제목</option>
                        <option value="1">내용</option>
                        <option value="2">작성자</option>
                    </select>
                </div>
                <div class="col-12 col-md">
                    <label for="searchWrd" class="form-label">검색어</label>
                    <input type="search" th:field="*{searchWrd}" class="form-control" maxlength="50">
                </div>
                <div class="col-12 col-md-auto">
                    <div class="search-actions">
                        <button type="submit" class="btn btn-secondary"><i class="bi bi-search me-1" aria-hidden="true"></i>검색</button>
                        <a th:if="${filtered}" th:href="@{/notices}" class="btn btn-outline-secondary">초기화</a>
                    </div>
                </div>
            </div>
        </form>

        <th:block th:replace="~{fragments/common :: resultCount(${paginationInfo})}"></th:block>

        <div class="panel">
            <div class="table-responsive">
                <table class="table table-hover table-cards">
                    <caption class="visually-hidden">공지사항 목록: 번호, 제목, 작성자, 등록일, 조회수</caption>
                    <thead>
                    <tr>
                        <th scope="col" class="d-none d-md-table-cell text-center col-num">번호</th>
                        <th scope="col">제목</th>
                        <th scope="col" class="text-center">작성자</th>
                        <th scope="col" class="text-center col-date">등록일</th>
                        <th scope="col" class="text-center">조회</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="n, stat : ${resultList}">
                        <!--/* 게시판 역순 번호: 전체건수 - (현재페이지-1)*페이지당건수 - 행번호 (eGov 샘플과 같은 계산) */-->
                        <td class="d-none d-md-table-cell text-center">
                            <span th:if="${n.noticeAt == 'Y'}" class="status status-danger">중요</span>
                            <span th:unless="${n.noticeAt == 'Y'}" class="text-sub"
                                  th:text="${paginationInfo.totalRecordCount - (searchVO.pageIndex - 1) * searchVO.recordCountPerPage - stat.index}">1</span>
                        </td>
                        <td class="cell-title">
                            <span th:if="${n.noticeAt == 'Y'}" class="status status-danger d-md-none me-1">중요</span>
                            <a th:href="@{/notices/{id}(id=${n.nttId})}" th:text="${n.nttSj}">제목</a>
                            <th:block th:unless="${#strings.isEmpty(n.atchFileId)}">
                                <i class="bi bi-paperclip attach-mark" aria-hidden="true"></i><span class="visually-hidden">첨부파일 있음</span>
                            </th:block>
                        </td>
                        <td data-label="작성자" class="text-center" th:text="${n.frstRegisterNm}">김담당</td>
                        <td data-label="등록일" class="text-center text-sub text-nowrap" th:text="${n.frstRegisterPnttm}">2026-10-21</td>
                        <td data-label="조회" class="text-center text-sub" th:text="${n.inqireCo}">0</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(resultList)}">
                        <td colspan="5" class="empty-row">등록된 공지사항이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <th:block th:replace="~{fragments/common :: pagination(${paginationInfo})}"></th:block>
    </div>
</th:block>
</body>
</html>
