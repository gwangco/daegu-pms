<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>공지사항</title>
</head>
<body>
<!--/* eGovFrame CRUD 코드 생성기의 noticeList.html 구조(검색 → 목록 → 페이징 → 등록)를 공통 레이아웃으로 옮김 */-->
<th:block layout:fragment="content">
    <div class="page-head">
        <div class="container">
            <nav aria-label="현재 위치">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">홈</a></li>
                    <li class="breadcrumb-item active" aria-current="page">공지사항</li>
                </ol>
            </nav>
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-2">
                <div>
                    <h1>공지사항</h1>
                    <p class="lead-sub">지원사업 운영과 시스템 이용 안내를 확인하세요.</p>
                </div>
                <a sec:authorize="hasAnyRole('MANAGER', 'ADMIN')" th:href="@{/notices/new}" class="btn btn-primary">
                    <i class="bi bi-pencil me-1" aria-hidden="true"></i>공지 등록
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <form id="searchForm" th:action="@{/notices}" th:object="${searchVO}" method="get" class="search-box" role="search">
            <div class="row g-2 align-items-end">
                <input type="hidden" th:field="*{pageIndex}">
                <div class="col-md-2">
                    <label for="searchCondition" class="form-label">검색 대상</label>
                    <select th:field="*{searchCondition}" class="form-select">
                        <option value="">제목+내용</option>
                        <option value="title">제목</option>
                        <option value="content">내용</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label for="searchKeyword" class="form-label">검색어</label>
                    <input type="search" th:field="*{searchKeyword}" class="form-control" maxlength="50">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-search me-1" aria-hidden="true"></i>검색</button>
                </div>
            </div>
        </form>

        <th:block th:replace="~{fragments/common :: resultCount(${paginationInfo})}"></th:block>

        <div class="panel">
            <div class="table-responsive">
                <table class="table table-hover">
                    <caption class="visually-hidden">공지사항 목록: 번호, 제목, 작성자, 등록일, 조회수</caption>
                    <thead>
                    <tr>
                        <th scope="col" class="text-center col-num">번호</th>
                        <th scope="col">제목</th>
                        <th scope="col" class="d-none d-md-table-cell text-center">작성자</th>
                        <th scope="col" class="text-center col-date">등록일</th>
                        <th scope="col" class="d-none d-md-table-cell text-center">조회</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="n, stat : ${resultList}">
                        <!--/* 게시판 역순 번호: 전체건수 - (현재페이지-1)*페이지당건수 - 행번호 (eGov 샘플과 같은 계산) */-->
                        <td class="text-center">
                            <span th:if="${n.importantYn == 'Y'}" class="status status-danger">중요</span>
                            <span th:unless="${n.importantYn == 'Y'}" class="text-sub"
                                  th:text="${paginationInfo.totalRecordCount - (searchVO.pageIndex - 1) * searchVO.recordCountPerPage - stat.index}">1</span>
                        </td>
                        <td>
                            <a th:href="@{/notices/{id}(id=${n.noticeId})}" class="text-body"
                               th:classappend="${n.importantYn == 'Y'} ? 'fw-bold' : 'fw-semibold'" th:text="${n.title}">제목</a>
                        </td>
                        <td class="d-none d-md-table-cell text-center" th:text="${n.writerName}">김담당</td>
                        <td class="text-center text-sub" th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd')}">2026-10-21</td>
                        <td class="d-none d-md-table-cell text-center text-sub" th:text="${n.viewCount}">0</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(resultList)}">
                        <td colspan="5" class="empty-row">등록된 공지사항이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <th:block th:replace="~{fragments/common :: pagination(${paginationInfo})}"></th:block>
    </div>
</th:block>
</body>
</html>
