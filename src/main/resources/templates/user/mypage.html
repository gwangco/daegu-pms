<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>내 정보</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <div class="container">
            <nav aria-label="현재 위치">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">홈</a></li>
                    <li class="breadcrumb-item active" aria-current="page">내 정보</li>
                </ol>
            </nav>
            <h1>내 정보</h1>
            <p class="lead-sub">연락처와 이메일은 암호화되어 저장되며, 가리지 않은 전체 값은 본인에게만 보입니다.</p>
        </div>
    </div>

    <div class="container">
        <section class="panel" aria-labelledby="me-title">
            <div class="panel-head"><h2 id="me-title">계정 정보</h2></div>
            <dl class="info-list">
                <div>
                    <dt>아이디</dt>
                    <dd th:text="${me.userId}">company1</dd>
                </div>
                <div>
                    <dt>이름</dt>
                    <dd th:text="${me.userName}">이대표</dd>
                </div>
                <div>
                    <dt>권한</dt>
                    <dd><span class="role-chip" th:text="${me.roleLabel}">기업회원</span></dd>
                </div>
                <div>
                    <dt>소속</dt>
                    <dd th:text="${me.companyName}">(주)대구모빌리티솔루션</dd>
                </div>
                <div th:if="${me.role == 'ROLE_COMPANY'}">
                    <dt>사업자등록번호</dt>
                    <dd th:text="${me.businessNo}">504-81-98765</dd>
                </div>
                <div>
                    <dt>이메일</dt>
                    <dd th:text="${me.email}">ceo@mobility.example.com</dd>
                </div>
                <div>
                    <dt>연락처</dt>
                    <dd th:text="${me.phone}">010-0000-4001</dd>
                </div>
                <div>
                    <dt>최근 로그인</dt>
                    <dd th:text="${me.lastLoginAt != null} ? ${#temporals.format(me.lastLoginAt, 'yyyy-MM-dd HH:mm')} : '-'">-</dd>
                </div>
            </dl>
        </section>
    </div>
</th:block>
</body>
</html>
