<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>로그인</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container">
        <div class="login-wrap">
            <div class="login-card">
                <img class="brand-logo" th:src="@{/images/logo.svg}" alt="" width="48" height="48">
                <h1>로그인</h1>
                <p class="text-sub mb-4">지원사업 신청·심사·정산 업무를 이용하려면 로그인하세요.</p>

                <div th:if="${loginError}" class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1" aria-hidden="true"></i><span th:text="${loginError}">아이디 또는 비밀번호가 일치하지 않습니다.</span>
                </div>

                <form th:action="@{/login-process}" method="post">
                    <div class="mb-3">
                        <label for="userId" class="form-label">아이디</label>
                        <input type="text" name="userId" id="userId" class="form-control" autocomplete="username"
                               maxlength="50" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">비밀번호</label>
                        <input type="password" name="password" id="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-xl w-100">로그인</button>
                </form>
                <p class="notice-box mt-3 mb-0">
                    <i class="bi bi-shield-lock" aria-hidden="true"></i><span th:text="${loginPolicy}">비밀번호를 5회 연속 틀리면 계정이 30분 동안 잠깁니다.</span>
                </p>

                <!--/* 로컬 데모 전용 계정(db/seed). 누르면 아이디·비밀번호 칸을 채우고 로그인 버튼은 직접 누른다 */-->
                <section class="demo-login" aria-labelledby="demo-title">
                    <h2 id="demo-title">데모 계정 빠른 입력</h2>
                    <div class="demo-login-grid">
                        <button type="button" class="btn btn-outline-secondary" data-demo-user="company1" data-demo-password="company1234">기업</button>
                        <button type="button" class="btn btn-outline-secondary" data-demo-user="manager1" data-demo-password="manager1234">사업담당자</button>
                        <button type="button" class="btn btn-outline-secondary" data-demo-user="evaluator1" data-demo-password="eval1234">평가위원</button>
                        <button type="button" class="btn btn-outline-secondary" data-demo-user="admin" data-demo-password="admin1234">총괄관리자</button>
                    </div>
                </section>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
