<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>로그인</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container">
        <div class="login-wrap">
            <div class="panel panel-body p-4 p-md-5">
                <h1 class="h3 fw-bold mb-1">로그인</h1>
                <p class="text-sub mb-4">지원사업 신청·심사·정산 업무를 이용하려면 로그인하세요.</p>

                <div th:if="${loginError}" class="alert alert-danger py-2" role="alert" th:text="${loginError}">
                    아이디 또는 비밀번호가 일치하지 않습니다.
                </div>

                <form th:action="@{/login-process}" method="post">
                    <div class="mb-3">
                        <label for="userId" class="form-label">아이디</label>
                        <input type="text" name="userId" id="userId" class="form-control" autocomplete="username"
                               maxlength="50" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">비밀번호</label>
                        <input type="password" name="password" id="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">로그인</button>
                </form>

                <div class="mt-4 pt-3 border-top">
                    <p class="small text-sub mb-2">데모 계정 빠른 입력</p>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-demo-user="company1" data-demo-password="company1234">기업</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-demo-user="manager1" data-demo-password="manager1234">사업담당자</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-demo-user="evaluator1" data-demo-password="eval1234">평가위원</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-demo-user="admin" data-demo-password="admin1234">총괄관리자</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
