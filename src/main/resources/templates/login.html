<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 | D-PMS 대구 지원사업 포털</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f1f4f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 440px; width: 100%; border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
    </style>
</head>
<body>

<div class="login-card card p-4 p-md-5 bg-white">
    <div class="text-center mb-4">
        <span class="badge bg-primary px-3 py-1 fs-6 mb-2">대구광역시 D-PMS</span>
        <h4 class="fw-bold text-dark">지원사업 통합관리 포털</h4>
        <p class="text-muted small">공공 R&D 및 사업비 e-정산 시스템에 로그인하세요</p>
    </div>

    <div th:if="${loginError}" class="alert alert-danger py-2 small" th:text="${loginError}">
        아이디 또는 비밀번호가 일치하지 않습니다.
    </div>

    <form th:action="@{/login-process}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">사용자 아이디</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" name="userId" id="userId" class="form-control" placeholder="아이디를 입력하세요" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">비밀번호</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">로그인</button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
        <span class="text-muted small">빠른 테스트 입력:</span>
        <div class="btn-group btn-group-sm w-100 mt-2" role="group">
            <button type="button" class="btn btn-outline-secondary" onclick="fillCreds('company1', 'company1234')">기업</button>
            <button type="button" class="btn btn-outline-secondary" onclick="fillCreds('manager1', 'manager1234')">담당자</button>
            <button type="button" class="btn btn-outline-secondary" onclick="fillCreds('evaluator1', 'eval1234')">심사위원</button>
            <button type="button" class="btn btn-outline-secondary" onclick="fillCreds('admin', 'admin1234')">총괄관리자</button>
        </div>
        <div class="mt-3">
            <a th:href="@{/}" class="text-decoration-none small text-secondary"><i class="bi bi-arrow-left"></i> 메인으로 돌아가기</a>
        </div>
    </div>
</div>

<script>
    function fillCreds(u, p) {
        document.getElementById('userId').value = u;
        document.getElementById('password').value = p;
    }
</script>
</body>
</html>
