<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 평가 과제 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: flash}"></div>

<div class="container py-4">
    <div class="mb-4">
        <h3 class="fw-bold text-dark mb-1">내 평가 과제</h3>
        <p class="text-muted small mb-0">배정된 과제의 사업계획서를 검토하고 정량(40점)·정성(60점) 점수를 입력하세요. 제출 후에는 수정할 수 없습니다.</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>공고명</th>
                            <th>과제명</th>
                            <th style="width: 15%">신청기업</th>
                            <th class="text-center" style="width: 8%">총점</th>
                            <th class="text-center" style="width: 10%">평가상태</th>
                            <th class="text-center" style="width: 12%">배정일</th>
                            <th class="text-center" style="width: 10%">채점</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ev : ${evaluations}">
                            <td class="small text-truncate" style="max-width: 220px;" th:text="${ev.announcementTitle}">공고명</td>
                            <td class="fw-semibold" th:text="${ev.projectName}">과제명</td>
                            <td th:text="${ev.companyName}">기업명</td>
                            <td class="text-center fw-bold" th:text="${ev.status == 'COMPLETED'} ? ${ev.totalScore} : '-'">-</td>
                            <td class="text-center">
                                <span th:if="${ev.status == 'COMPLETED'}" class="badge bg-success">제출완료</span>
                                <span th:if="${ev.status == 'ASSIGNED'}" class="badge bg-warning text-dark">채점대기</span>
                            </td>
                            <td class="text-center small" th:text="${#temporals.format(ev.assignedAt, 'yyyy-MM-dd')}">2026-10-19</td>
                            <td class="text-center">
                                <a th:href="@{/evaluator/evaluations/{id}(id=${ev.evaluationId})}" class="btn btn-sm"
                                   th:classappend="${ev.status == 'ASSIGNED'} ? 'btn-primary' : 'btn-outline-secondary'"
                                   th:text="${ev.status == 'ASSIGNED'} ? '채점하기' : '조회'">채점하기</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(evaluations)}">
                            <td colspan="7" class="text-center py-4 text-muted">배정된 평가 과제가 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
