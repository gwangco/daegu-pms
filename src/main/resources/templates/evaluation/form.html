<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>온라인 채점표 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: flash}"></div>

<div class="container py-4" style="max-width: 960px;">
    <div class="mb-3">
        <a th:href="@{/evaluator/evaluations}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> 평가 목록으로 돌아가기</a>
    </div>

    <!-- 평가 대상 과제 요약 -->
    <div class="card border-0 shadow-sm p-4 bg-white mb-4">
        <div class="small text-muted mb-1" th:text="${evaluation.announcementTitle}">공고명</div>
        <h4 class="fw-bold text-dark mb-3" th:text="${app.projectName}">과제명</h4>
        <table class="table table-bordered align-middle mb-3">
            <tbody>
                <tr>
                    <th class="table-light text-center" style="width: 20%;">신청기업</th>
                    <td style="width: 30%;" th:text="${app.companyName}">기업명</td>
                    <th class="table-light text-center" style="width: 20%;">신청 지원금</th>
                    <td style="width: 30%;" th:text="${#numbers.formatInteger(app.requestGrant, 0, 'COMMA')} + '원'">0원</td>
                </tr>
                <tr>
                    <th class="table-light text-center">사업계획서</th>
                    <td colspan="3">
                        <a th:if="${app.planFileId != null}" th:href="@{/files/{id}(id=${app.planFileId})}" class="text-decoration-none">
                            <i class="bi bi-download me-1"></i><span th:text="${app.planFileName}">plan.pdf</span>
                        </a>
                        <span th:if="${app.planFileId == null}" class="text-muted small">첨부 없음 (샘플 데이터)</span>
                    </td>
                </tr>
            </tbody>
        </table>
        <h6 class="fw-bold text-dark mb-2">사업계획 요약</h6>
        <div class="p-3 bg-light rounded-3" style="line-height: 1.8; white-space: pre-line;" th:text="${app.summary}">요약</div>
    </div>

    <!-- 채점표 -->
    <div class="card border-0 shadow-sm p-4 bg-white">
        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-clipboard-check text-primary me-2"></i>온라인 채점표</h5>

        <!-- 제출 완료된 평가: 읽기 전용 -->
        <div th:if="${evaluation.status == 'COMPLETED'}">
            <div class="row g-3 text-center mb-3">
                <div class="col-4"><div class="p-3 bg-light rounded-3"><div class="small text-muted">정량 (40)</div><div class="fs-4 fw-bold" th:text="${evaluation.quantitativeScore}">0</div></div></div>
                <div class="col-4"><div class="p-3 bg-light rounded-3"><div class="small text-muted">정성 (60)</div><div class="fs-4 fw-bold" th:text="${evaluation.qualitativeScore}">0</div></div></div>
                <div class="col-4"><div class="p-3 bg-light rounded-3"><div class="small text-muted">총점 (100)</div><div class="fs-4 fw-bold text-primary" th:text="${evaluation.totalScore}">0</div></div></div>
            </div>
            <div class="p-3 border rounded-3 small" style="white-space: pre-line;" th:text="${evaluation.evalComment}">의견</div>
            <div class="small text-muted mt-2">제출일시: <span th:text="${#temporals.format(evaluation.evaluatedAt, 'yyyy-MM-dd HH:mm')}"></span></div>
        </div>

        <!-- 채점 대기: 입력 폼 -->
        <form th:if="${evaluation.status == 'ASSIGNED'}" th:action="@{/evaluator/evaluations/{id}(id=${evaluation.evaluationId})}" method="post">
            <div th:if="${app.status != 'EVALUATING'}" class="alert alert-warning small py-2">
                현재 과제가 '전문가심사중' 상태가 아니어서 채점할 수 없습니다.
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary">정량 평가 (0~<span th:text="${maxQuantitative}">40</span>점)</label>
                    <input type="number" id="quantitativeScore" name="quantitativeScore" class="form-control" min="0" th:max="${maxQuantitative}" required oninput="calcTotal()">
                    <div class="form-text small">매출·인력·특허 등 객관 지표</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary">정성 평가 (0~<span th:text="${maxQualitative}">60</span>점)</label>
                    <input type="number" id="qualitativeScore" name="qualitativeScore" class="form-control" min="0" th:max="${maxQualitative}" required oninput="calcTotal()">
                    <div class="form-text small">기술성·사업성·지역 연계성</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary">총점 (자동계산)</label>
                    <input type="number" id="totalScore" class="form-control bg-light fw-bold" readonly placeholder="0">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">종합 의견 <span class="text-danger">*</span></label>
                <textarea name="evalComment" class="form-control" rows="5" maxlength="2000" required
                          placeholder="기술적 차별성, 사업화 가능성, 보완 필요사항 등을 작성하세요."></textarea>
            </div>
            <div class="d-flex justify-content-end pt-3 border-top">
                <button type="submit" class="btn btn-primary px-4 fw-semibold" th:disabled="${app.status != 'EVALUATING'}"
                        onclick="return confirm('제출 후에는 수정할 수 없습니다. 제출하시겠습니까?');">
                    <i class="bi bi-send-check me-1"></i> 평가 제출
                </button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function calcTotal() {
        const q1 = parseInt(document.getElementById('quantitativeScore').value, 10) || 0;
        const q2 = parseInt(document.getElementById('qualitativeScore').value, 10) || 0;
        document.getElementById('totalScore').value = q1 + q2;
    }
</script>
</body>
</html>
