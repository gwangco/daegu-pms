<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>신청·심사 현황</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <div class="container">
            <nav aria-label="현재 위치">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">홈</a></li>
                    <li class="breadcrumb-item active" aria-current="page">신청·심사 현황</li>
                </ol>
            </nav>
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-2">
                <div>
                    <h1>
                        <th:block sec:authorize="hasRole('COMPANY')">내 신청 현황</th:block>
                        <th:block sec:authorize="hasRole('EVALUATOR')">배정 과제</th:block>
                        <th:block sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">신청·심사 관리</th:block>
                    </h1>
                    <p class="lead-sub">
                        <span sec:authorize="hasRole('COMPANY')">우리 기업이 신청한 과제만 표시됩니다.</span>
                        <span sec:authorize="hasRole('EVALUATOR')">평가위원으로 배정된 과제만 표시됩니다.</span>
                        <span sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">접수된 전체 과제의 심사 진행 현황입니다.</span>
                    </p>
                </div>
                <a sec:authorize="hasAnyRole('MANAGER', 'ADMIN')"
                   th:href="@{/excel/applications(status=${searchVO.status}, searchKeyword=${searchVO.searchKeyword})}"
                   class="btn btn-outline-primary">
                    <i class="bi bi-file-earmark-excel me-1" aria-hidden="true"></i>엑셀 다운로드
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <form id="searchForm" th:action="@{/applications}" th:object="${searchVO}" method="get" class="search-box" role="search">
            <div class="row g-2 align-items-end">
                <input type="hidden" th:field="*{pageIndex}">
                <div class="col-md-3">
                    <label for="status" class="form-label">진행상태</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="">전체</option>
                        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}">상태</option>
                    </select>
                </div>
                <div class="col-md-7">
                    <label for="searchKeyword" class="form-label">검색어</label>
                    <input type="search" th:field="*{searchKeyword}" class="form-control" placeholder="과제명·기업명 또는 접수번호(DPMS-…)" maxlength="50">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-search me-1" aria-hidden="true"></i>검색</button>
                </div>
            </div>
        </form>

        <th:block th:replace="~{fragments/common :: resultCount(${paginationInfo})}"></th:block>

        <div class="panel">
            <div class="table-responsive">
                <table class="table table-hover">
                    <caption class="visually-hidden">신청 과제 목록: 접수번호, 공고명, 신청기업, 과제명, 신청 지원금, 평균 점수, 진행상태</caption>
                    <thead>
                    <tr>
                        <th scope="col" class="text-center">접수번호</th>
                        <th class="d-none d-md-table-cell" scope="col">공고명</th>
                        <th scope="col">신청기업</th>
                        <th scope="col">과제명</th>
                        <th scope="col" class="text-end">신청 지원금</th>
                        <th scope="col" class="d-none d-md-table-cell text-center">평균 점수</th>
                        <th scope="col" class="text-center col-status">진행상태</th>
                        <th scope="col" class="text-center col-action">바로가기</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="app : ${applications}">
                        <td class="text-center fw-semibold text-nowrap" th:text="${app.receiptNo}">DPMS-00000001</td>
                        <td class="d-none d-md-table-cell small cell-truncate" th:text="${app.announcementTitle}">공고명</td>
                        <td>
                            <span class="fw-semibold" th:text="${app.companyName}">대구모빌리티</span>
                            <div class="small text-sub" th:text="${app.businessNo}">504-81-98765</div>
                        </td>
                        <td>
                            <a th:href="@{/applications/{id}(id=${app.applicationId})}" class="fw-semibold text-body" th:text="${app.projectName}">과제명</a>
                        </td>
                        <td class="text-end fw-semibold text-nowrap" th:text="${#numbers.formatInteger(app.requestGrant, 0, 'COMMA')} + '원'">100,000,000원</td>
                        <td class="d-none d-md-table-cell text-center" th:text="${app.avgScore != null} ? ${#numbers.formatDecimal(app.avgScore, 1, 1)} : '-'">-</td>
                        <td class="text-center"><th:block th:replace="~{fragments/common :: appStatus(${app.status})}"></th:block></td>
                        <td class="text-center">
                            <a th:if="${app.status == 'SELECTED' and settlementAccessible}"
                               th:href="@{/settlements/application/{id}(id=${app.applicationId})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-receipt me-1" aria-hidden="true"></i>e-정산
                            </a>
                            <a th:unless="${app.status == 'SELECTED' and settlementAccessible}"
                               th:href="@{/applications/{id}(id=${app.applicationId})}" class="btn btn-sm btn-outline-secondary">상세</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(applications)}">
                        <td colspan="8" class="empty-row">조회된 신청 과제가 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <th:block th:replace="~{fragments/common :: pagination(${paginationInfo})}"></th:block>
    </div>
</th:block>
</body>
</html>
