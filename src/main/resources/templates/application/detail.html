<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>과제 신청 상세 조회 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width: 900px;">
    <div class="mb-3">
        <a th:href="@{/applications}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left"></i> 신청 목록으로 돌아가기
        </a>
    </div>

    <div class="card border-0 shadow-sm p-4 bg-white mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <span class="badge bg-secondary me-1" th:text="'접수번호 #' + ${application.applicationId}">#1</span>
                <span th:if="${application.status == 'SUBMITTED'}" class="badge bg-secondary">접수완료</span>
                <span th:if="${application.status == 'EVALUATING'}" class="badge bg-info text-dark">전문가심사중</span>
                <span th:if="${application.status == 'SELECTED'}" class="badge bg-success">최종선정(협약)</span>
                <span th:if="${application.status == 'REJECTED'}" class="badge bg-danger">심사탈락</span>
            </div>
            <div class="text-muted small">
                제출일시: <span th:text="${#temporals.format(application.submittedAt, 'yyyy-MM-dd HH:mm')}">2026-10-15 14:30</span>
            </div>
        </div>

        <h4 class="fw-bold text-dark mb-3" th:text="${application.projectName}">과제명</h4>
        <div class="text-secondary small mb-4">
            지원사업 공고: <strong class="text-dark" th:text="${application.announcementTitle}">공고명</strong>
        </div>

        <!-- 신청 정보 테이블 -->
        <table class="table table-bordered align-middle mb-4">
            <tbody>
                <tr>
                    <th class="table-light text-center" style="width: 20%;">신청 기업명</th>
                    <td style="width: 30%;" th:text="${application.companyName}">대구모빌리티</td>
                    <th class="table-light text-center" style="width: 20%;">사업자등록번호</th>
                    <td style="width: 30%;" th:text="${application.businessNo}">504-81-98765</td>
                </tr>
                <tr>
                    <th class="table-light text-center">총 소요 예산</th>
                    <td class="fw-semibold" th:text="${#numbers.formatInteger(application.totalBudget, 0, 'COMMA')} + '원'">125,000,000원</td>
                    <th class="table-light text-center">신청 지원금</th>
                    <td class="fw-semibold text-primary" th:text="${#numbers.formatInteger(application.requestGrant, 0, 'COMMA')} + '원'">100,000,000원</td>
                </tr>
                <tr>
                    <th class="table-light text-center">기업 자부담금</th>
                    <td th:text="${#numbers.formatInteger(application.selfFunding, 0, 'COMMA')} + '원'">25,000,000원</td>
                    <th class="table-light text-center">제출 첨부파일</th>
                    <td>
                        <span class="badge bg-light text-dark border">
                            <i class="bi bi-file-earmark-pdf text-danger me-1"></i>
                            <span th:text="${application.planFileName}">plan.pdf</span>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>

        <h6 class="fw-bold text-dark mb-2"><i class="bi bi-file-text text-primary me-2"></i>사업계획서 요약 내용</h6>
        <div class="p-3 bg-light rounded-3 mb-4" style="line-height: 1.8;" th:text="${application.summary}">
            사업계획 요약 내용...
        </div>

        <!-- 사업 담당자/관리자 전용: 상태 머신 제어 영역 -->
        <div sec:authorize="hasAnyRole('MANAGER', 'ADMIN')" class="p-3 bg-light rounded-3 border border-secondary mb-4">
            <h6 class="fw-bold text-dark mb-2"><i class="bi bi-sliders text-primary me-1"></i> [관리자 전용] 과제 심사 상태 변경</h6>
            <form th:action="@{'/applications/' + ${application.applicationId} + '/status'}" method="post" class="d-flex align-items-center gap-2">
                <select name="status" class="form-select form-select-sm" style="max-width: 220px;">
                    <option value="SUBMITTED" th:selected="${application.status == 'SUBMITTED'}">접수완료 (SUBMITTED)</option>
                    <option value="EVALUATING" th:selected="${application.status == 'EVALUATING'}">전문가심사중 (EVALUATING)</option>
                    <option value="SELECTED" th:selected="${application.status == 'SELECTED'}">최종선정/협약 (SELECTED)</option>
                    <option value="REJECTED" th:selected="${application.status == 'REJECTED'}">심사탈락 (REJECTED)</option>
                </select>
                <button type="submit" class="btn btn-sm btn-dark">상태 변경 저장</button>
            </form>
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="d-flex justify-content-between pt-3 border-top">
            <a th:href="@{/applications}" class="btn btn-outline-secondary">목록</a>
            <div th:if="${application.status == 'SELECTED'}">
                <a th:href="@{'/settlements/application/' + ${application.applicationId}}" class="btn btn-success">
                    <i class="bi bi-receipt me-1"></i> 사업비 e-정산 시스템 바로가기
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
