<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm" style="background-color: #0b2545 !important;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold" th:href="@{/}">
            <span class="badge bg-primary me-2 px-2 py-1 fs-6">대구</span>
            <span>D-PMS 지원사업 포털</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/announcements}">사업공고</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/applications}">과제신청·선정현황</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">
                    <a class="nav-link text-warning" th:href="@{/announcements/new}">+ 공고등록</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <!-- 비로그인 상태 -->
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm me-2">로그인</a>
                </div>
                <!-- 로그인 상태 -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center text-light">
                    <div class="me-3 text-end">
                        <span class="fw-semibold" sec:authentication="name">사용자</span>
                        <span class="badge bg-secondary ms-1" sec:authorize="hasRole('ADMIN')">총괄관리자</span>
                        <span class="badge bg-info text-dark ms-1" sec:authorize="hasRole('MANAGER')">사업담당자</span>
                        <span class="badge bg-warning text-dark ms-1" sec:authorize="hasRole('EVALUATOR')">평가위원</span>
                        <span class="badge bg-success ms-1" sec:authorize="hasRole('COMPANY')">기업회원</span>
                    </div>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm">로그아웃</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-light text-muted py-4 mt-5 border-top">
    <div class="container text-center">
        <p class="mb-1 fw-bold text-dark">대구광역시 공공 R&D·창업 지원사업 통합관리 및 e-정산 시스템 (D-PMS)</p>
        <p class="small text-secondary mb-0">전자정부프레임워크 4.x / Spring Boot 3.3 / MyBatis / H2-MariaDB 표준 아키텍처 준수</p>
        <p class="small text-secondary mt-1">© 2026 Daegu Metropolitan City. All Rights Reserved.</p>
    </div>
</footer>
</body>
</html>
