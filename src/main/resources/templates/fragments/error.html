<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* 오류 화면 본문 공통 조각: code(상태 코드 표시), title(제목), message(안내 문구) */-->
<div th:fragment="errorContent(code, title, message)" class="container">
    <div class="error-wrap panel">
        <span class="error-icon" aria-hidden="true">
            <i class="bi" th:classappend="${code == '403'} ? 'bi-shield-lock' : (${code == '404'} ? 'bi-search' : 'bi-exclamation-circle')"></i>
        </span>
        <p class="error-code" th:text="'오류 코드 ' + ${code}">오류 코드 400</p>
        <h1 th:text="${title}">요청을 처리할 수 없습니다</h1>
        <p class="text-sub mb-4" th:text="${message}">입력 내용을 확인한 뒤 다시 시도하세요.</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <button type="button" class="btn btn-outline-secondary btn-lg" data-action="back">이전 화면</button>
            <a th:href="@{/}" class="btn btn-primary btn-lg">메인으로</a>
        </div>
    </div>
</div>
</body>
</html>
