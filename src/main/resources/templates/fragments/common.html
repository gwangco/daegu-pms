<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- 신청서 진행상태 배지 -->
<th:block th:fragment="appStatus(status)">
    <span th:switch="${status}">
        <span th:case="'TEMP_SAVED'" class="badge bg-light text-dark border">임시저장</span>
        <span th:case="'SUBMITTED'" class="badge bg-secondary">접수완료</span>
        <span th:case="'DOCUMENT_PASSED'" class="badge bg-primary">서류적격통과</span>
        <span th:case="'EVALUATING'" class="badge bg-info text-dark">전문가심사중</span>
        <span th:case="'SELECTED'" class="badge bg-success">최종선정(협약)</span>
        <span th:case="'REJECTED'" class="badge bg-danger">심사탈락</span>
        <span th:case="*" class="badge bg-light text-dark" th:text="${status}">상태</span>
    </span>
</th:block>

<!-- 정산 검수상태 배지 -->
<th:block th:fragment="settleStatus(status)">
    <span th:switch="${status}">
        <span th:case="'REQUESTED'" class="badge bg-warning text-dark">검수요청</span>
        <span th:case="'APPROVED'" class="badge bg-success">승인완료</span>
        <span th:case="'REJECTED'" class="badge bg-danger">보완(반려)</span>
        <span th:case="*" class="badge bg-light text-dark" th:text="${status}">상태</span>
    </span>
</th:block>

<!--
    전자정부 표준 페이징 바  ([처음] [이전] 1 2 3 ... [다음] [마지막])
    eGov JSP 의 <ui:pagination paginationInfo="${paginationInfo}" jsFunction="fn_egov_link_page"/> 와 같은 역할.
    검색폼(id=searchForm)의 hidden pageIndex 값을 바꿔 submit 하므로 검색조건이 유지된다.
-->
<th:block th:fragment="pagination(paginationInfo)">
    <nav th:if="${paginationInfo.totalRecordCount > 0}" class="mt-4" aria-label="페이지 이동">
        <ul class="pagination pagination-sm justify-content-center mb-0">
            <li class="page-item" th:classappend="${paginationInfo.currentPageNo == 1} ? 'disabled'">
                <a class="page-link" href="#" data-page="1" title="처음">&laquo;</a>
            </li>
            <li class="page-item" th:classappend="${!paginationInfo.hasPreviousBlock} ? 'disabled'">
                <a class="page-link" href="#" th:data-page="${paginationInfo.firstPageNoOnPageList - 1}" title="이전 블록">&lsaquo; 이전</a>
            </li>
            <li class="page-item"
                th:each="pageNo : ${#numbers.sequence(paginationInfo.firstPageNoOnPageList, paginationInfo.lastPageNoOnPageList)}"
                th:classappend="${pageNo == paginationInfo.currentPageNo} ? 'active'">
                <a class="page-link" href="#" th:data-page="${pageNo}" th:text="${pageNo}">1</a>
            </li>
            <li class="page-item" th:classappend="${!paginationInfo.hasNextBlock} ? 'disabled'">
                <a class="page-link" href="#" th:data-page="${paginationInfo.lastPageNoOnPageList + 1}" title="다음 블록">다음 &rsaquo;</a>
            </li>
            <li class="page-item" th:classappend="${paginationInfo.currentPageNo == paginationInfo.totalPageCount} ? 'disabled'">
                <a class="page-link" href="#" th:data-page="${paginationInfo.totalPageCount}" title="마지막">&raquo;</a>
            </li>
        </ul>
    </nav>
    <script>
        (function () {
            const form = document.getElementById('searchForm');
            if (!form) return;
            // 검색 버튼으로 새로 검색하면 1페이지부터
            form.addEventListener('submit', function () { form.pageIndex.value = 1; });
            // 페이지 번호 클릭 시 검색조건을 유지한 채 해당 페이지로 이동 (eGov fn_egov_link_page)
            document.querySelectorAll('.pagination [data-page]').forEach(function (link) {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (link.parentElement.classList.contains('disabled')) return;
                    form.pageIndex.value = link.dataset.page;
                    form.submit();
                });
            });
        })();
    </script>
</th:block>

</body>
</html>
