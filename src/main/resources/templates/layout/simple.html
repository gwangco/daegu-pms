<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!--/*
    오류 화면 전용 레이아웃. 메뉴(권한별 표시)와 처리 결과 알림을 넣지 않아
    오류 화면을 그리다가 다시 오류가 나는 경우를 줄인다.
    예외 클래스명·스택트레이스·SQL 같은 내부 정보는 화면에 출력하지 않는다.
*/-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | D-PMS">D-PMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">

</head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<header class="site-header">

        <a class="brand" th:href="@{/}">
            <img class="brand-logo" th:src="@{/images/logo.svg}" alt="" width="40" height="40">

<footer class="site-footer">
    <div class="container">
        <p class="mb-0">D-PMS 대구형 공공 R&amp;D·창업 지원사업 통합관리 및 e-정산 시스템 (취업 포트폴리오)</p>
