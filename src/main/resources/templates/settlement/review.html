<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>정산 검수함</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <div class="container">
            <nav aria-label="현재 위치">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">홈</a></li>
                    <li class="breadcrumb-item active" aria-current="page">정산 검수함</li>
                </ol>
            </nav>
            <h1>정산 검수함</h1>
            <p class="lead-sub">협약 과제 전체의 사업비 집행 요청입니다. 오래 기다린 요청부터 보여 줍니다. 과제를 열어 증빙을 확인하고 승인하거나 보완을 요청하세요.</p>
        </div>
    </div>

    <div class="container">
        <form id="searchForm" th:action="@{/settlements/review}" th:object="${searchVO}" method="get" class="search-box" role="search">
            <input type="hidden" th:field="*{pageIndex}">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="status" class="form-label">검수상태</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="">전체</option>
                        <option value="REQUESTED">검수요청</option>
                        <option value="APPROVED">승인완료</option>
                        <option value="REJECTED">보완요청(반려)</option>
                    </select>
                </div>
                <div class="col-12 col-md-auto">
                    <div class="search-actions">
                        <button type="submit" class="btn btn-secondary"><i class="bi bi-funnel me-1" aria-hidden="true"></i>조회</button>
                    </div>
                </div>
            </div>
        </form>

        <th:block th:replace="~{fragments/common :: resultCount(${paginationInfo})}"></th:block>

        <div class="panel">
            <div class="table-responsive">
                <table class="table table-hover table-cards">
                    <caption class="visually-hidden">정산 검수 목록: 접수번호, 과제명, 기업, 비목, 금액, 요청일, 상태</caption>
                    <thead>
                    <tr>
                        <th scope="col" class="text-center">접수번호</th>
                        <th scope="col">과제명 · 집행 내용</th>
                        <th scope="col">기업</th>
                        <th scope="col">비목</th>
                        <th scope="col" class="text-end">금액</th>
                        <th scope="col" class="text-center">요청일</th>
                        <th scope="col" class="text-center col-status">상태</th>
                        <th scope="col" class="text-center col-action">검수</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${settlements}">
                        <td data-label="접수번호" class="text-center fw-bold text-nowrap" th:text="${s.receiptNo}">DPMS-00000001</td>
                        <td class="cell-title">
                            <a th:href="@{/settlements/application/{id}(id=${s.applicationId})}" th:text="${s.projectName}">과제명</a>
                            <span class="cell-sub" th:text="${s.vendorName} + ' · ' + ${s.description}">거래처 · 내용</span>
                        </td>
                        <td data-label="기업" class="text-nowrap-md" th:text="${s.companyName}">기업명</td>
                        <td data-label="비목" class="small" th:text="${s.itemName}">비목</td>
                        <td data-label="금액" class="text-end fw-bold text-nowrap" th:text="${#numbers.formatInteger(s.totalAmount, 0, 'COMMA')} + '원'">0원</td>
                        <td data-label="요청일" class="text-center small text-nowrap" th:text="${#temporals.format(s.createdAt, 'MM-dd HH:mm')}">10-18 17:00</td>
                        <td data-label="상태" class="text-center">
                            <div>
                                <th:block th:replace="~{fragments/common :: settleStatus(${s.status})}"></th:block>
                                <span th:if="${s.resubmitCount > 0}" class="cell-sub" th:text="${'재요청 ' + s.resubmitCount + '회'}">재요청 1회</span>
                            </div>
                        </td>
                        <td class="text-center cell-actions">
                            <a th:href="@{/settlements/application/{id}(id=${s.applicationId})}" class="btn btn-sm btn-outline-primary">열기</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(settlements)}">
                        <td colspan="8" class="empty-row">조건에 맞는 정산 요청이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <th:block th:replace="~{fragments/common :: pagination(${paginationInfo})}"></th:block>
    </div>
</th:block>
</body>
</html>
