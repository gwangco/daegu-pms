<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>사업비 e-정산 관리 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="mb-3">
        <a th:href="@{/applications}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> 과제 현황으로 돌아가기</a>
    </div>

    <!-- 상단 과제 기본 정보 및 예산 집행 카드 -->
    <div class="card border-0 shadow-sm p-4 bg-white mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge bg-success">협약체결 과제</span>
            <span class="text-muted small">과제번호 #<span th:text="${application.applicationId}">1</span></span>
        </div>
        <h4 class="fw-bold text-dark mb-1" th:text="${application.projectName}">과제명</h4>
        <div class="text-secondary small mb-4">신청기업: <strong class="text-dark" th:text="${application.companyName}">기업명</strong></div>

        <!-- 예산 집행 현황 프로그레스 -->
        <div class="row g-3 text-center mb-2">
            <div class="col-md-4">
                <div class="p-3 bg-light rounded-3">
                    <div class="text-muted small">총 협약 지원금</div>
                    <div class="fs-4 fw-bold text-dark" th:text="${#numbers.formatInteger(application.requestGrant, 0, 'COMMA')} + '원'">100,000,000원</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 bg-light rounded-3">
                    <div class="text-muted small">승인 집행액 (누적)</div>
                    <div class="fs-4 fw-bold text-primary" th:text="${#numbers.formatInteger(totalApproved, 0, 'COMMA')} + '원'">16,500,000원</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 bg-light rounded-3">
                    <div class="text-muted small">잔여 예산</div>
                    <div class="fs-4 fw-bold text-success" th:text="${#numbers.formatInteger(application.requestGrant - totalApproved, 0, 'COMMA')} + '원'">83,500,000원</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 집행 내역 테이블 및 집행 등록 버튼 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold text-dark mb-0"><i class="bi bi-receipt text-primary me-2"></i>비목별 사업비 집행 및 세금계산서 증빙 내역</h5>
        <button sec:authorize="hasRole('COMPANY')" type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#expenseModal">
            <i class="bi bi-plus-lg me-1"></i> 사업비 집행 등록
        </button>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="text-center" style="width: 10%">비목</th>
                            <th style="width: 12%">집행일자</th>
                            <th style="width: 15%">거래처명</th>
                            <th>집행내용</th>
                            <th class="text-end" style="width: 14%">총 집행금액</th>
                            <th class="text-center" style="width: 12%">증빙서류</th>
                            <th class="text-center" style="width: 12%">검수상태</th>
                            <th class="text-center" style="width: 15%" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">검수관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${settlements}">
                            <td class="text-center">
                                <span class="badge bg-secondary" th:text="${s.itemName}">직접재료비</span>
                            </td>
                            <td class="small" th:text="${s.expenseDate}">2026-10-16</td>
                            <td class="fw-semibold text-dark" th:text="${s.vendorName}">(주)대구센서테크</td>
                            <td class="small" th:text="${s.description}">센서 테스트보드 구입</td>
                            <td class="text-end fw-bold text-primary" th:text="${#numbers.formatInteger(s.totalAmount, 0, 'COMMA')} + '원'">16,500,000원</td>
                            <td class="text-center">
                                <span class="badge bg-light text-dark border">
                                    <i class="bi bi-file-earmark-pdf text-danger me-1"></i>
                                    <span th:text="${s.receiptFileName}">invoice.pdf</span>
                                </span>
                            </td>
                            <td class="text-center">
                                <span th:if="${s.status == 'REQUESTED'}" class="badge bg-warning text-dark">검수요청</span>
                                <span th:if="${s.status == 'APPROVED'}" class="badge bg-success">승인완료</span>
                                <span th:if="${s.status == 'REJECTED'}" class="badge bg-danger">보완(반려)</span>
                            </td>
                            <!-- 사업담당자 전용: 승인 및 반려 버튼 -->
                            <td class="text-center" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">
                                <div th:if="${s.status == 'REQUESTED'}" class="btn-group btn-group-sm">
                                    <form th:action="@{'/settlements/' + ${s.settlementId} + '/review'}" method="post" class="d-inline">
                                        <input type="hidden" name="applicationId" th:value="${application.applicationId}">
                                        <input type="hidden" name="status" value="APPROVED">
                                        <button type="submit" class="btn btn-outline-success btn-sm">승인</button>
                                    </form>
                                    <form th:action="@{'/settlements/' + ${s.settlementId} + '/review'}" method="post" class="d-inline ms-1">
                                        <input type="hidden" name="applicationId" th:value="${application.applicationId}">
                                        <input type="hidden" name="status" value="REJECTED">
                                        <input type="hidden" name="rejectReason" value="세금계산서 증빙 금액 불일치">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">반려</button>
                                    </form>
                                </div>
                                <span th:unless="${s.status == 'REQUESTED'}" class="text-muted small">처리완료</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(settlements)}">
                            <td colspan="8" class="text-center py-4 text-muted">등록된 사업비 집행 내역이 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 사업비 집행 등록 모달 -->
<div class="modal fade" id="expenseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">사업비 집행 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/settlements/register}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="applicationId" th:value="${application.applicationId}">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">비목 선택 <span class="text-danger">*</span></label>
                        <select name="itemCode" class="form-select form-select-sm" required>
                            <option value="EXP01">인건비 (연구원/개발자)</option>
                            <option value="EXP02" selected>직접재료비 및 시약구입비</option>
                            <option value="EXP03">시제품 제작 및 가공비</option>
                            <option value="EXP04">연구활동비 (출장/여비)</option>
                            <option value="EXP05">위탁정산 및 수수료</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">집행 일자 <span class="text-danger">*</span></label>
                        <input type="date" name="expenseDate" class="form-control form-control-sm" required value="2026-10-20">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">거래처명 (공급자) <span class="text-danger">*</span></label>
                        <input type="text" name="vendorName" class="form-control form-control-sm" placeholder="예: 북성로정밀가공" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-semibold">공급가액 (원) <span class="text-danger">*</span></label>
                            <input type="number" id="modalSupply" name="supplyAmount" class="form-control form-control-sm" placeholder="10000000" required oninput="calcVat()">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold">부가세 (10% 자동)</label>
                            <input type="number" id="modalVat" name="vatAmount" class="form-control form-control-sm bg-light" readonly placeholder="1000000">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">집행 내용 요약 <span class="text-danger">*</span></label>
                        <input type="text" name="description" class="form-control form-control-sm" placeholder="예: 시제품 1차 샘플 금형 가공비" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">증빙 영수증/세금계산서 파일명</label>
                        <input type="text" name="receiptFileName" class="form-control form-control-sm" value="tax_invoice_20261020.pdf">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">닫기</button>
                    <button type="submit" class="btn btn-primary btn-sm fw-semibold">집행 등록 (검수요청)</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function calcVat() {
        const supply = parseFloat(document.getElementById('modalSupply').value) || 0;
        document.getElementById('modalVat').value = Math.round(supply * 0.1);
    }
</script>
</body>
</html>
