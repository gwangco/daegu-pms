<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>접속 기록</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <div class="container">
            <nav aria-label="현재 위치">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">홈</a></li>
                    <li class="breadcrumb-item">시스템 관리</li>
                    <li class="breadcrumb-item active" aria-current="page">접속 기록</li>
                </ol>
            </nav>
            <h1>접속 기록</h1>
            <p class="lead-sub">로그인 성공·실패·잠긴 계정 시도·로그아웃을 시간순으로 확인합니다. 없는 아이디로 시도한 경우 입력값은 저장하지 않습니다.</p>
        </div>
    </div>

    <div class="container">
        <form id="searchForm" th:action="@{/admin/login-history}" th:object="${searchVO}" method="get" class="search-box" role="search">
            <div class="row g-2 align-items-end">
                <input type="hidden" th:field="*{pageIndex}">
                <div class="col-md-3">
                    <label for="searchKeyword" class="form-label">아이디</label>
                    <input type="search" th:field="*{searchKeyword}" class="form-control" maxlength="50">
                </div>
                <div class="col-md-2">
                    <label for="resultCode" class="form-label">결과</label>
                    <select th:field="*{resultCode}" class="form-select">
                        <option value="">전체</option>
                        <option th:each="r : ${results}" th:value="${r.name()}" th:text="${r.label}">결과</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="fromDate" class="form-label">시작일</label>
                    <input type="date" th:field="*{fromDate}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label for="toDate" class="form-label">종료일</label>
                    <input type="date" th:field="*{toDate}" class="form-control">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-search me-1" aria-hidden="true"></i>검색</button>
                </div>
            </div>
        </form>

        <th:block th:replace="~{fragments/common :: resultCount(${paginationInfo})}"></th:block>

        <div class="panel">
            <div class="table-responsive">
                <table class="table table-hover">
                    <caption class="visually-hidden">접속 기록: 일시, 아이디, 이름, 결과, 접속 IP</caption>
                    <thead>
                    <tr>
                        <th scope="col" class="col-date">일시</th>
                        <th scope="col">아이디</th>
                        <th scope="col" class="d-none d-md-table-cell">이름</th>
                        <th scope="col" class="text-center col-status">결과</th>
                        <th scope="col">접속 IP</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="h : ${histories}">
                        <td class="small text-nowrap" th:text="${#temporals.format(h.loginAt, 'yyyy-MM-dd HH:mm:ss')}">2026-10-21 10:00:00</td>
                        <td>
                            <span th:if="${h.userId != null}" class="fw-semibold" th:text="${h.userId}">company1</span>
                            <span th:if="${h.userId == null}" class="text-sub">(없는 아이디)</span>
                        </td>
                        <td class="d-none d-md-table-cell" th:text="${h.userName}">이대표</td>
                        <td class="text-center">
                            <span class="status" th:classappend="${h.failure} ? 'status-danger' : 'status-success'" th:text="${h.resultLabel}">로그인</span>
                        </td>
                        <td class="small text-nowrap" th:text="${h.clientIp}">127.0.0.1</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(histories)}">
                        <td colspan="5" class="empty-row">조건에 맞는 접속 기록이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <th:block th:replace="~{fragments/common :: pagination(${paginationInfo})}"></th:block>
    </div>
</th:block>
</body>
</html>
