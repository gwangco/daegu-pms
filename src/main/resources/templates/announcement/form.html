<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>신규 지원사업 공고 등록 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width: 860px;">
    <div class="mb-3">
        <a th:href="@{/announcements}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> 공고 목록으로 돌아가기</a>
    </div>

    <div class="card border-0 shadow-sm p-4 bg-white">
        <div class="border-bottom pb-3 mb-4">
            <span class="badge bg-primary mb-1">사업담당자</span>
            <h4 class="fw-bold text-dark mb-0">신규 지원사업 공고 등록</h4>
        </div>

        <form th:action="@{/announcements/new}" th:object="${announcement}" method="post" novalidate>
            <!-- 서비스 업무 규칙 위반 메시지 (BindingResult.reject 로 등록된 전역 오류) -->
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger small py-2">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류</div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">공고명 <span class="text-danger">*</span></label>
                <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid" maxlength="200" placeholder="예: 2026년 대구 미래차 전장부품 시험인증 지원사업">
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary">지원 분야 <span class="text-danger">*</span></label>
                    <select th:field="*{fieldCode}" class="form-select" th:errorclass="is-invalid">
                        <option value="">선택</option>
                        <option th:each="code : ${fieldCodes}" th:value="${code.codeId}" th:text="${code.codeName}">분야</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{fieldCode}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary">총 지원 예산 (원) <span class="text-danger">*</span></label>
                    <input type="number" th:field="*{totalBudget}" class="form-control" th:errorclass="is-invalid" min="1" placeholder="500000000">
                    <div class="invalid-feedback" th:errors="*{totalBudget}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary">기업당 최대 지원금 (원) <span class="text-danger">*</span></label>
                    <input type="number" th:field="*{maxGrant}" class="form-control" th:errorclass="is-invalid" min="1" placeholder="50000000">
                    <div class="invalid-feedback" th:errors="*{maxGrant}"></div>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">접수 시작일 <span class="text-danger">*</span></label>
                    <input type="date" th:field="*{startDate}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{startDate}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary">접수 마감일 <span class="text-danger">*</span></label>
                    <input type="date" th:field="*{endDate}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{endDate}"></div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">공고 내용 및 지원 요건 <span class="text-danger">*</span></label>
                <textarea th:field="*{content}" class="form-control" th:errorclass="is-invalid" rows="8" maxlength="4000"
                          placeholder="지원 대상, 지원 내용, 신청 자격, 제출 서류, 평가 방법 등을 작성하세요."></textarea>
                <div class="invalid-feedback" th:errors="*{content}"></div>
            </div>

            <div class="d-flex justify-content-between pt-3 border-top">
                <a th:href="@{/announcements}" class="btn btn-outline-secondary">취소</a>
                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                    <i class="bi bi-megaphone me-1"></i> 공고 등록
                </button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
