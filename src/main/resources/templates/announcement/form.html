<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>공고 등록</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <div class="container narrow">
            <nav aria-label="현재 위치">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">홈</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/announcements}">사업공고</a></li>
                    <li class="breadcrumb-item active" aria-current="page">공고 등록</li>
                </ol>
            </nav>
            <h1>공고 등록</h1>
            <p class="lead-sub"><span class="required-mark">*</span> 표시는 필수 입력입니다.</p>
        </div>
    </div>

    <div class="container narrow">
        <form th:action="@{/announcements/new}" th:object="${announcement}" method="post" class="panel panel-body" novalidate>
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류</div>
            </div>

            <div class="mb-3">
                <label for="title" class="form-label">공고명 <span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
                <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid" maxlength="200"
                       placeholder="예: 2026년 미래차 전장부품 시험인증 지원사업" required>
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label for="fieldCode" class="form-label">지원 분야 <span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
                    <select th:field="*{fieldCode}" class="form-select" th:errorclass="is-invalid" required>
                        <option value="">선택</option>
                        <option th:each="code : ${fieldCodes}" th:value="${code.codeId}" th:text="${code.codeName}">분야</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{fieldCode}"></div>
                </div>
                <div class="col-md-4">
                    <label for="totalBudget" class="form-label">총 지원 예산(원) <span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
                    <input type="number" th:field="*{totalBudget}" class="form-control" th:errorclass="is-invalid" min="1" required>
                    <div class="invalid-feedback" th:errors="*{totalBudget}"></div>
                </div>
                <div class="col-md-4">
                    <label for="maxGrant" class="form-label">기업당 최대 지원금(원) <span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
                    <input type="number" th:field="*{maxGrant}" class="form-control" th:errorclass="is-invalid" min="1" required>
                    <div class="invalid-feedback" th:errors="*{maxGrant}"></div>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="startDate" class="form-label">접수 시작일 <span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
                    <input type="date" th:field="*{startDate}" class="form-control" th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{startDate}"></div>
                </div>
                <div class="col-md-6">
                    <label for="endDate" class="form-label">접수 마감일 <span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
                    <input type="date" th:field="*{endDate}" class="form-control" th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{endDate}"></div>
                </div>
            </div>

            <div class="mb-1">
                <label for="content" class="form-label">공고 내용 및 지원 요건 <span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
                <textarea th:field="*{content}" class="form-control" th:errorclass="is-invalid" rows="10" maxlength="4000" required
                          placeholder="지원 대상, 지원 내용, 신청 자격, 제출 서류, 평가 방법을 작성하세요."></textarea>
                <div class="invalid-feedback" th:errors="*{content}"></div>
            </div>

            <div class="form-actions">
                <a th:href="@{/announcements}" class="btn btn-outline-secondary">취소</a>
                <button type="submit" class="btn btn-primary px-4">공고 등록</button>
            </div>
        </form>
    </div>
</th:block>
</body>
</html>
