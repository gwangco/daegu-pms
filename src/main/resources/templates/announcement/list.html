<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>지원사업 공고 목록 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: flash}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1">대구광역시 지원사업 공고</h3>
            <p class="text-muted small mb-0">현재 접수 및 진행 중인 기술지원 및 R&D 공고를 조회하세요.</p>
        </div>
        <div sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">
            <a th:href="@{/announcements/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i> 신규 공고 등록
            </a>
        </div>
    </div>

    <!-- 검색 및 필터 바 (페이지 이동 시에도 이 폼을 submit 하여 검색조건 유지) -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3">
            <form id="searchForm" th:action="@{/announcements}" th:object="${searchVO}" method="get" class="row g-2 align-items-center">
                <input type="hidden" th:field="*{pageIndex}">
                <div class="col-md-3">
                    <select th:field="*{fieldCode}" class="form-select form-select-sm">
                        <option value="">전체 분야</option>
                        <option th:each="code : ${fieldCodes}" th:value="${code.codeId}" th:text="${code.codeName}">분야</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select th:field="*{status}" class="form-select form-select-sm">
                        <option value="">전체 상태</option>
                        <option value="OPEN">접수중 (OPEN)</option>
                        <option value="CLOSED">접수마감 (CLOSED)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="text" th:field="*{keyword}" class="form-control form-control-sm" placeholder="공고명·내용 검색어 입력..." maxlength="50">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary btn-sm w-100">
                        <i class="bi bi-search me-1"></i> 검색
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="small text-muted mb-2">
        총 <strong class="text-dark" th:text="${paginationInfo.totalRecordCount}">0</strong>건
        (<span th:text="${paginationInfo.currentPageNo}">1</span> / <span th:text="${paginationInfo.totalPageCount}">1</span> 페이지)
    </div>

    <!-- 공고 카드 목록 -->
    <div class="row g-3">
        <div class="col-md-12" th:each="a : ${announcements}">
            <div class="card border-0 shadow-sm p-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="mb-1">
                            <span class="badge bg-secondary me-1" th:text="${a.fieldName}">모빌리티</span>
                            <span th:if="${a.status == 'OPEN'}" class="badge bg-success">접수중</span>
                            <span th:if="${a.status == 'CLOSED'}" class="badge bg-danger">마감</span>
                        </div>
                        <h5 class="fw-bold mb-2">
                            <a th:href="@{/announcements/{id}(id=${a.announcementId})}" class="text-decoration-none text-dark" th:text="${a.title}">
                                지원사업 공고명
                            </a>
                        </h5>
                        <p class="text-muted small mb-2 text-truncate" style="max-width: 800px;" th:text="${a.content}">공고 요약 내용...</p>
                        <div class="text-secondary small">
                            <span class="me-3"><i class="bi bi-calendar3 me-1"></i>접수기간: <strong th:text="${a.startDate} + ' ~ ' + ${a.endDate}">2026-10-01 ~ 2026-11-30</strong></span>
                            <span class="me-3"><i class="bi bi-person me-1"></i>담당: <span th:text="${a.writerName}">김담당</span></span>
                            <span><i class="bi bi-eye me-1"></i>조회수: <span th:text="${a.viewCount}">120</span></span>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="text-muted small">기업당 최대지원금</div>
                        <div class="fs-5 fw-bold text-primary mb-2" th:text="${#numbers.formatInteger(a.maxGrant, 0, 'COMMA')} + '원'">100,000,000원</div>
                        <a th:href="@{/announcements/{id}(id=${a.announcementId})}" class="btn btn-outline-primary btn-sm">
                            상세보기 <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(announcements)}">
            <div class="card border-0 shadow-sm p-5 text-center text-muted">검색 조건에 맞는 공고가 없습니다.</div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: pagination(${paginationInfo})}"></th:block>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
