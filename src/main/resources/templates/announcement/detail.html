<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${announcement.title}">공고 상세</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <div class="container medium">
            <nav aria-label="현재 위치">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">홈</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/announcements}">사업공고</a></li>
                    <li class="breadcrumb-item active" aria-current="page">공고 상세</li>
                </ol>
            </nav>
            <div class="d-flex flex-wrap gap-2 mt-2 mb-1">
                <span class="status status-blue" th:text="${announcement.fieldName}">모빌리티</span>
                <th:block th:replace="~{fragments/common :: announcementStatus(${announcement.status})}"></th:block>
            </div>
            <h1 th:text="${announcement.title}">2026년 지원사업 공고명</h1>
            <p class="lead-sub small">
                등록 <span th:text="${#temporals.format(announcement.createdAt, 'yyyy-MM-dd')}">2026-10-01</span>
                · 조회 <span th:text="${announcement.viewCount}">245</span>
            </p>
        </div>
    </div>

    <div class="container medium">
        <section class="panel mb-4" aria-labelledby="summary-title">
            <div class="panel-head"><h2 id="summary-title">지원 개요</h2></div>
            <div class="table-responsive">
                <table class="table table-bordered table-info-grid mb-0">
                    <caption class="visually-hidden">공고 지원 개요</caption>
                    <tbody>
                    <tr>
                        <th scope="row">총 지원 예산</th>
                        <td th:text="${#numbers.formatInteger(announcement.totalBudget, 0, 'COMMA')} + '원'">1,500,000,000원</td>
                        <th scope="row">기업당 최대 지원금</th>
                        <td class="fw-bold" th:text="${#numbers.formatInteger(announcement.maxGrant, 0, 'COMMA')} + '원'">100,000,000원</td>
                    </tr>
                    <tr>
                        <th scope="row">접수 기간</th>
                        <td th:text="${announcement.startDate} + ' ~ ' + ${announcement.endDate}">2026-10-01 ~ 2026-11-30</td>
                        <th scope="row">담당자</th>
                        <td th:text="${announcement.writerName}">김담당</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="panel mb-4" aria-labelledby="content-title">
            <div class="panel-head"><h2 id="content-title">공고 내용 및 지원 요건</h2></div>
            <div class="panel-body">
                <div class="prewrap" th:text="${announcement.content}">공고 상세 본문</div>
            </div>
        </section>

        <div class="form-actions">
            <a th:href="@{/announcements}" class="btn btn-outline-secondary">목록</a>
            <div>
                <th:block sec:authorize="hasRole('COMPANY')">
                    <a th:if="${announcement.status == 'OPEN'}" th:href="@{/applications/apply(announcementId=${announcement.announcementId})}"
                       class="btn btn-primary px-4"><i class="bi bi-pencil-square me-1" aria-hidden="true"></i>온라인 신청</a>
                </th:block>
                <a sec:authorize="isAnonymous()" th:if="${announcement.status == 'OPEN'}" th:href="@{/login}" class="btn btn-primary px-4">
                    기업 회원 로그인 후 신청
                </a>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
