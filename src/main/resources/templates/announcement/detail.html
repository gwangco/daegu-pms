<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${announcement.title} + ' | D-PMS'">공고 상세 | D-PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="mb-3">
        <a th:href="@{/announcements}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> 공고 목록으로 돌아가기</a>
    </div>

    <div class="card border-0 shadow-sm p-4 mb-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <span class="badge bg-secondary me-1" th:text="${announcement.fieldName}">모빌리티</span>
                <span th:if="${announcement.status == 'OPEN'}" class="badge bg-success">접수중</span>
                <span th:if="${announcement.status == 'CLOSED'}" class="badge bg-danger">마감</span>
            </div>
            <div class="text-muted small">
                조회수: <span th:text="${announcement.viewCount}">245</span> | 등록일시: <span th:text="${#temporals.format(announcement.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-01 10:00</span>
            </div>
        </div>

        <h3 class="fw-bold mb-4 text-dark" th:text="${announcement.title}">2026년 지원사업 공고명</h3>

        <div class="table-responsive mb-4">
            <table class="table table-bordered align-middle">
                <tbody>
                    <tr>
                        <th class="table-light text-center" style="width: 20%;">총 지원 예산</th>
                        <td style="width: 30%;" class="fw-semibold text-primary" th:text="${#numbers.formatInteger(announcement.totalBudget, 0, 'COMMA')} + '원'">1,500,000,000원</td>
                        <th class="table-light text-center" style="width: 20%;">기업당 최대 지원금</th>
                        <td style="width: 30%;" class="fw-semibold text-danger" th:text="${#numbers.formatInteger(announcement.maxGrant, 0, 'COMMA')} + '원'">100,000,000원</td>
                    </tr>
                    <tr>
                        <th class="table-light text-center">접수 기간</th>
                        <td th:text="${announcement.startDate} + ' ~ ' + ${announcement.endDate}">2026-10-01 ~ 2026-11-30</td>
                        <th class="table-light text-center">소관 부서 / 담당자</th>
                        <td th:text="${announcement.writerName} + ' (' + ${announcement.writerId} + ')'">김담당</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-info-circle text-primary me-2"></i>공고 상세 내용 및 지원 요건</h5>
        <div class="p-4 bg-light rounded-3 mb-4" style="line-height: 1.8; min-height: 150px;" th:text="${announcement.content}">
            공고 상세 본문 내용...
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
            <a th:href="@{/announcements}" class="btn btn-outline-secondary">목록</a>
            <div>
                <!-- 기업 사용자만 신청 가능 -->
                <div sec:authorize="hasRole('COMPANY')">
                    <a th:if="${announcement.status == 'OPEN'}" th:href="@{'/applications/apply?announcementId=' + ${announcement.announcementId}}" class="btn btn-primary px-4">
                        <i class="bi bi-pencil-square me-1"></i> 온라인 사업계획서 신청
                    </a>
                </div>
                <!-- 비로그인 시 로그인 유도 -->
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-primary px-4">
                        <i class="bi bi-box-arrow-in-right me-1"></i> 기업 로그인 후 신청하기
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
