# 자동 테스트 전용 설정 (IntegrationTestSupport 가 local,test 프로필로 실행 → local 설정 위에 이 파일이 덮어쓴다)
spring:
  datasource:
    # 개발 DB(dpms)와 분리된 테스트 전용 DB. 테스트가 시작할 때마다 비우고 다시 만든다
    url: ${DPMS_TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/dpms_test?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # TestDatabaseConfig 가 DB 이름이 _test 로 끝나는지 확인한 뒤에만 clean 한다
    clean-disabled: false
